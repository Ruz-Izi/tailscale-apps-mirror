name: Mirror Tailscale APK to Google Drive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Restore private rclone config
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Download official Tailscale APK and upload to Drive
        run: |
          rclone copyurl \
            "https://pkgs.tailscale.com/stable/tailscale-android-universal-1.102.3.apk" \
            gdrive: \
            --auto-filename \
            --header-filename \
            --no-clobber \
            --retries 5 \
            --low-level-retries 10 \
            --stats-one-line

      - name: Verify uploaded APK
        run: |
          rclone lsl gdrive:
